  function loadSaves() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }

  function writeSaves(arr) {

  //  绘制工具

  function roundRect(g, x, y, w, h, r) {
    g.drawRoundedRect(x, y, w, h, r);
  }

  function dimScreen(alpha = 0.7) {
    const g = new PIXI.Graphics();
    g.beginFill(0x000000, alpha);
    g.drawRect(0, 0, W, H);
    g.endFill();
    return g;
  }

  function makeText(str, opts = {}) {
    return new PIXI.Text(str, Object.assign({
      fontFamily: "Microsoft YaHei, PingFang SC, sans-serif",
      fontSize: 16, fill: 0xffffff,
    }, opts));
  }

  function makeBtn(label, w = 200, h = 46, accent = 0xe94560) {
    const c = new PIXI.Container();
    const bg = new PIXI.Graphics();
    bg.beginFill(accent, 0.85);
    bg.drawRoundedRect(0, 0, w, h, h / 2);
    bg.endFill();
    c.addChild(bg);
    const t = makeText(label, { fontSize: 17, fontWeight: "bold", letterSpacing: 3 });
    t.anchor.set(0.5); t.x = w / 2; t.y = h / 2;
    c.addChild(t);
    c.eventMode = "static"; c.cursor = "pointer";
    c.on("pointerover", () => { bg.tint = 0xff7799; c.scale.set(1.04); });
    c.on("pointerout",  () => { bg.tint = 0xffffff; c.scale.set(1); });
    return c;
  }

  // ================================================================
  //  背景绘制（渐变+星星）
  // ================================================================
  function drawSkyBg(color = 0x0f0820, withStars = true) {
    const g = new PIXI.Graphics();
    g.beginFill(color);
    g.drawRect(0, 0, W, H);
    g.endFill();
    // 光晕
    g.beginFill(0x3d1a4a, 0.15);
    g.drawEllipse(W * 0.5, H * 0.45, W * 0.7, H * 0.55);
    g.endFill();
    g.beginFill(0x1a1050, 0.2);
    g.drawRect(0, 0, W, H * 0.35);
    g.endFill();
    if (withStars) {
      for (let i = 0; i < 80; i++) {
        g.beginFill(0xffffff, Math.random() * 0.3 + 0.05);
        g.drawCircle(Math.random() * W, Math.random() * H, Math.random() * 1.2 + 0.2);
        g.endFill();
      }
    }
    return g;
  }

      const texW = titleTex.width || W;
      const texH = titleTex.height || H;
      const scale = Math.max(W / texW, H / texH);
      bgSprite.scale.set(scale);
      bgSprite.x = (W - texW * scale) / 2;
      bgSprite.y = (H - texH * scale) / 2;
    }
    if (titleTex.baseTexture.valid) fitBg();
    else titleTex.baseTexture.once("loaded", fitBg);

    // ---- 透明热区（盖在设计图按钮上）----
    // 根据设计图里按钮的位置来调 x, y, w, h
    function hotZone(xPct, yPct, wPct, hPct, onClick) {
      const zone = new PIXI.Container();
      const bg = new PIXI.Graphics();
      bg.beginFill(0xffffff, 0.01);
      bg.drawRoundedRect(0, 0, W * wPct, H * hPct, 8);
      bg.endFill();
      zone.addChild(bg);
      zone.x = W * xPct; zone.y = H * yPct;
      // 用 hitArea 确保点击区域
      zone.hitArea = new PIXI.Rectangle(0, 0, W * wPct, H * hPct);
      zone.eventMode = "static";
      zone.cursor = "pointer";
      zone.on("pointertap", onClick);
      zone.on("pointerdown", onClick);
      return zone;
    }

    // 按钮热区（对准设计图）
    uiLayer.addChild(hotZone(0.745, 0.395, 0.186, 0.052, () => startNewGame()));
    if (loadSaves().length > 0) {
      uiLayer.addChild(hotZone(0.745, 0.455, 0.186, 0.062, () => showLoadScreen()));
    }
    uiLayer.addChild(hotZone(0.740, 0.675, 0.196, 0.047, () => {}));
    uiLayer.addChild(hotZone(0.740, 0.725, 0.196, 0.057, () => showSettings()));
  }

  function showSlotScreen(mode) {
    screen = mode;
    clearAll();
    bgLayer.addChild(drawSkyBg(0x0a0612, false));
    const dim = dimScreen(0.6);
    bgLayer.addChild(dim);

    const isSave = mode === STATE.SAVE;
    const title = makeText(isSave ? "💾 保 存 游 戏" : "📂 读 取 存 档", {
      fontSize: 28, fontWeight: "bold", fill: [0xffccdd, 0xff7799],
      fillGradientType: 0, letterSpacing: 4,
    });
    title.anchor.set(0.5, 0); title.x = W / 2; title.y = H * 0.05;
    uiLayer.addChild(title);

    const saves = loadSaves();

    // 3列 x 3行
    const cols = 3, rows = 3;
    const slotW = Math.min(220, (W - 80) / cols);
    const slotH = Math.min(130, (H * 0.65) / rows);
    const gapX = 20, gapY = 20;
    const gridW = cols * slotW + (cols - 1) * gapX;
    const gridH = rows * slotH + (rows - 1) * gapY;
    const startX = (W - gridW) / 2;
    const startY = title.y + title.height + 28;

    for (let i = 0; i < 9; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = startX + col * (slotW + gapX);
      const y = startY + row * (slotH + gapY);

      const slot = new PIXI.Container();
      const bg = new PIXI.Graphics();
      bg.beginFill(0x14102a, 0.55);
      bg.drawRoundedRect(0, 0, slotW, slotH, 10);
      bg.endFill();
      bg.lineStyle(1, 0x443355, 0.3);
      bg.drawRoundedRect(0, 0, slotW, slotH, 10);
      slot.addChild(bg);

      // 编号
      const num = makeText(String(i + 1).padStart(2, "0"), {
        fontSize: 32, fontWeight: "bold", fill: 0x443355,
      });
      num.anchor.set(1, 0); num.x = slotW - 14; num.y = 6;
      num.alpha = 0.45;
      slot.addChild(num);

      if (saves[i]) {
        const s = saves[i];
        slot.addChild(makeText(s.chapter || "???", { fontSize: 14, fontWeight: "bold" }));
        slot.children[2].x = 14; slot.children[2].y = 14;
        slot.addChild(makeText(s.date || "", { fontSize: 11, fill: 0x776688 }));
        slot.children[3].x = 14; slot.children[3].y = 36;
        slot.addChild(makeText((s.playtime || "?") + " 分钟", { fontSize: 11, fill: 0x776688 }));
        slot.children[4].x = 14; slot.children[4].y = 54;

        // 缩略图占位
        const thumb = new PIXI.Graphics();
        thumb.beginFill(0x1a1035);
        thumb.drawRoundedRect(0, 0, slotW - 24, slotH - 80, 4);
        thumb.endFill();
        thumb.x = 12; thumb.y = 72; thumb.alpha = 0.5;
        slot.addChild(thumb);
      } else {
        slot.addChild(makeText("— 空 —", { fontSize: 13, fill: 0x443355 }));
        slot.children[2].anchor.set(0.5);
        slot.children[2].x = slotW / 2; slot.children[2].y = slotH / 2;
      }

      slot.eventMode = "static";
      slot.cursor = "pointer";
      slot.on("pointerover", () => { bg.tint = 0x2a1a4a; });
      slot.on("pointerout",  () => { bg.tint = 0xffffff; });
      const idx = i;
      slot.on("pointertap", () => {
        if (isSave) {
          doSave(idx);
          showSlotScreen(mode); // 刷新
        } else if (saves[idx]) {
          doLoad(idx);
        }
      });
      slot.x = x; slot.y = y;
      uiLayer.addChild(slot);
    }

    // 返回按钮
    const backBtn = makeBtn("←  返  回", 160, 42, 0x443355);
    backBtn.x = (W - 160) / 2;
    backBtn.y = startY + gridH + 18;
    backBtn.on("pointertap", () => {
      if (gameTimer) showTitle(); // 从标题进来
      else showTitle();
    });
    uiLayer.addChild(backBtn);
  }

  function doSave(slotIdx) {
    const saves = loadSaves();
    const scene = story[curScene];
    const chapterName = scene.lines.length > 0 ? scene.lines[0].txt.substring(0, 12) : "???";
    saves[slotIdx] = {
      sceneId: curScene,
      lineIdx: curLine,
      chapter: chapterName,
      date: new Date().toLocaleString("zh-CN"),
      playtime: Math.floor(gameTime / 60),
    };
    writeSaves(saves);
    console.log("💾 存档 " + (slotIdx + 1) + " 完成");
  }

  function doLoad(slotIdx) {
    const saves = loadSaves();
    const s = saves[slotIdx];
    if (!s || !story[s.sceneId]) return;
    curScene = s.sceneId;
    curLine = Math.min(s.lineIdx, (story[s.sceneId].lines || []).length - 1);
    gameTime = (s.playtime || 0) * 60;
    showGameScreen();
  }

  function quickSave() {
    const saves = loadSaves();
    // 自动保存到第一个槽
    const scene = story[curScene];
    saves[0] = {
      sceneId: curScene, lineIdx: curLine,
      chapter: scene.lines[0]?.txt?.substring(0, 12) || "自动存档",
      date: new Date().toLocaleString("zh-CN"),
      playtime: Math.floor(gameTime / 60),
    };
    writeSaves(saves);
  }

  function launchMiniGame() {
    screen = "minigame";
    clearAll();
    W = app.screen.width; H = app.screen.height;

    // 背景
    const gameBg = new PIXI.Graphics();
    gameBg.beginFill(0x0a0a1a);
    gameBg.drawRect(0, 0, W, H);
    gameBg.endFill();
    // 地面线
    gameBg.lineStyle(2, 0x445566);
    gameBg.moveTo(0, H - 80); gameBg.lineTo(W, H - 80);
    bgLayer.addChild(gameBg);

    // 玩家（小方块）
    const player = new PIXI.Graphics();
    player.beginFill(0xe94560);
    player.drawRoundedRect(0, 0, 30, 30, 4);
    player.endFill();
    player.x = 80; player.y = H - 110;
    bgLayer.addChild(player);

    // 障碍物
    const obstacle = new PIXI.Graphics();
    obstacle.beginFill(0x667788);
    obstacle.drawRoundedRect(0, 0, 20, 30, 4);
    obstacle.endFill();
    obstacle.x = W + 100; obstacle.y = H - 110;
    bgLayer.addChild(obstacle);

    // 分数
    let score = 0;
    const scoreText = makeText("分数：" + score, { fontSize: 22, fill: 0xffffff, fontWeight: "bold" });
    scoreText.x = 20; scoreText.y = 20;
    uiLayer.addChild(scoreText);

    // 提示
    const hint = makeText("点击屏幕跳跃！", { fontSize: 16, fill: 0x8899aa });
    hint.anchor.set(0.5); hint.x = W/2; hint.y = H/2 - 50;
    uiLayer.addChild(hint);

    // 游戏状态
    let jumping = false;
    let vy = 0;
    const groundY = H - 110;
    let gameRunning = false;
    let speed = 6;

    // 点击开始/跳跃
    function onClick() {
      if (!gameRunning) { gameRunning = true; hint.visible = false; return; }
      if (!jumping) { jumping = true; vy = -12; }
    }
    app.view.addEventListener("click", onClick);

    // 游戏循环
    const gameTicker = new PIXI.Ticker();
    gameTicker.add(() => {
      if (!gameRunning) return;

      // 跳跃物理
      if (jumping) {
        player.y += vy;
        vy += 0.7;
        if (player.y >= groundY) {
          player.y = groundY;
          jumping = false;
          vy = 0;
        }
      }

      // 障碍物移动
      obstacle.x -= speed;
      if (obstacle.x < -30) {
        obstacle.x = W + Math.random() * 200;
        score++;
        scoreText.text = "分数：" + score;
        speed += 0.3;
      }

      // 碰撞检测
      const px = player.x, py = player.y, pw = 30, ph = 30;
      const ox = obstacle.x, oy = obstacle.y, ow = 20, oh = 30;
      if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
        // 撞上了
        gameRunning = false;
        gameTicker.destroy();
        app.view.removeEventListener("click", onClick);
        if (score >= 8) {
          affection = Math.min(5, affection + 1);
          setTimeout(() => {
            clearAll();
            curScene = "minigame_win"; curLine = 0;
            renderGameScene();
          }, 500);
        } else {
          affection = Math.max(0, affection - 2);
          setTimeout(() => {
            clearAll();
            curScene = "minigame_lose"; curLine = 0;
            renderGameScene();
          }, 500);
        }
      }
    });
    gameTicker.start();
  }

  function renderGameScene() {

      if (scene.bg === bgImages[key] || key.includes("street")) {

  function drawSprite(who, pos) {
    // 根据说话人找对应立绘图片（预先加载的纹理）
    const charImages = {
      "克俊华": 'assets/characters/kejunhua.png',
      "???":    'assets/characters/kejunhua.png',
    };
    const imgPath = charImages[who];
    const maxH = H - 190;

    if (imgPath) {
      const tex = PIXI.Texture.from(imgPath);
      const sprite = new PIXI.Sprite(tex);
      const doScale = () => {
        if (tex.height > 0) {
          const s = Math.min(maxH / tex.height, 0.9);
          sprite.scale.set(s);
        }
      };
      doScale();
      tex.baseTexture.on("update", doScale);
      sprite.anchor.set(0.5, 1);
      if (pos === "left")  { sprite.x = 131; sprite.y = 690; }
      else if (pos === "right") { sprite.x = 131; sprite.y = 690; }
      else                 { sprite.x = W / 2; sprite.y = H - 185; }
      sprite.scale.set(0.276);

      window._charSprite = sprite;

      uiLayer.addChild(sprite);
      return;
    }

    // gg—gay 没立绘就不显示了
  }

  function typewriter(text, target, onDone) {
    // Ctrl 按住直接显示全文
    if (ctrlHeld) {
      target.text = text;
      isTyping = false;
      if (onDone) onDone();
      return;
    }
    isTyping = true;
    target.text = "";
    if (typeTimer) clearInterval(typeTimer);
    const chars = [...text];
    let i = 0;
    typeTimer = setInterval(() => {
      target.text += chars[i]; i++;
      if (i >= chars.length) {
        clearInterval(typeTimer);
        typeTimer = null; isTyping = false;
        if (onDone) onDone();
      }
    }, settings.textSpeed);
  }

  function skipTypewriter() {
    if (!isTyping) return;
    clearInterval(typeTimer); typeTimer = null; isTyping = false;
    // 直接用 window._dialogueTxt 引用
    if (window._dialogueTxt) {
      const scene = story[curScene];
      window._dialogueTxt.text = scene.lines[curLine].txt;
    }
    // 显示▼
    for (const child of uiLayer.children) {
      if (child.name === "hint") child.alpha = 0.5;
    }
  }

  function clearAll() {
    bgLayer.removeChildren();
    uiLayer.removeChildren();
    fgLayer.removeChildren();
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    isTyping = false;
  }

  // ================================================================
  //  对话推进
  // ================================================================
  function advanceDialogue() {
    if (screen !== STATE.PLAYING) return;

    if (isTyping) { skipTypewriter(); return; }

    const scene = story[curScene];
    curLine++;

    if (curLine < scene.lines.length) {
      renderGameScene();
    } else if (scene.choices && scene.choices.length > 0) {
      showChoices(scene.choices);
    } else if (scene.next) {
      curScene = scene.next; curLine = 0;
      quickSave();
      if (curScene === "minigame_start") launchMiniGame();
      else renderGameScene();
    } else {
      // 完结 → 回标题
      stopGameTimer();
      setTimeout(() => showTitle(), 2500);
    }
  }

  function showChoices(choices) {
    const choiceLayer = new PIXI.Container();
    fgLayer.addChild(choiceLayer);
    choices.forEach((c, i) => {
      const btn = makeBtn(c.txt, Math.min(500, W * 0.65), 52, 0x142846);
      btn.x = (W - Math.min(500, W * 0.65)) / 2;
      btn.y = H - 175 - (choices.length - i) * 64 - 20;
      btn.alpha = 0;
      btn.on("pointertap", () => {
        fgLayer.removeChildren();
        curScene = c.next; curLine = 0;
        quickSave();
        if (curScene === "minigame_start") launchMiniGame();
        else renderGameScene();
      });
      choiceLayer.addChild(btn);
      // 错开弹出
      setTimeout(() => { btn.alpha = 1; }, i * 80 + 150);
    });
  }

  // ================================================================
  //  键盘 & 窗口
  // ================================================================
  let ctrlHeld = false;
  window.addEventListener("keydown", (e) => {
    if (e.code === "ControlLeft" || e.code === "ControlRight") { ctrlHeld = true; return; }
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      if (screen === STATE.PLAYING) advanceDialogue();
    }
    if (e.code === "Escape") {
      if (screen === STATE.PLAYING) showTitle();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ControlLeft" || e.code === "ControlRight") ctrlHeld = false;
  });

  window.addEventListener("resize", () => {
    app.renderer.resize(window.innerWidth, window.innerHeight);
    W = app.screen.width; H = app.screen.height;
    if (screen === STATE.TITLE) showTitle();
    else if (screen === STATE.PLAYING) renderGameScene();
  });

  // ================================================================
  //  启动
  // ================================================================
  // 启动
  W = app.screen.width; H = app.screen.height;
  showTitle();
  console.log("🎮 测试版1 就绪！");
  console.log("   操作：空格/点击推进对话 | Ctrl快进 | Esc回标题");
  console.log("   存档：9个存档位 | 设置：文字速度/音量");
  console.log("   🏳️‍🌈 我与克俊华的校园爱情故事");

  } catch(e) { console.error("引擎启动失败:", e); }
  </script>
</body>
</html>
