<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>对话框生成器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a2e; display:flex; justify-content:center; align-items:center; height:100vh; }

  /* ===== 日系 Galgame 对话框 ===== */
  .dialogue-wrapper {
    position: relative;
    width: 900px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
  }

  /* 角色立绘站位 */
  .sprite-left {
    position: absolute;
    bottom: 100%;
    left: 40px;
    width: 130px; height: 260px;
    background: linear-gradient(180deg,
      #e8c9a0 0%, #e8c9a0 14%,
      #2c1810 14%, #2c1810 19%,
      #e8c9a0 19%, #e8c9a0 25%,
      #3a5f8a 25%, #3a5f8a 52%,
      #1a1a2e 52%, #1a1a2e 84%,
      #4a3728 84%
    );
    border-radius: 100px 100px 0 0;
    z-index: 2;
  }

  .dialogue-box {
    position: relative;
    background: linear-gradient(180deg,
      rgba(14,10,26,0.94) 0%,
      rgba(18,14,32,0.94) 30%,
      rgba(16,12,28,0.94) 100%
    );
    border-radius: 20px;
    padding: 28px 32px 24px;
    min-height: 140px;
    /* 边框 */
    border: 1.5px solid rgba(224,85,112,0.3);
    /* 内发光 */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 -40px 40px rgba(0,0,0,0.2),
      0 0 0 1px rgba(0,0,0,0.5);
    /* 顶边高光 */
    overflow: visible;
  }

  /* 顶边高光线 */
  .dialogue-box::before {
    content: '';
    position: absolute;
    top: 1px; left: 20px; right: 20px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(224,85,112,0.3) 10%,
      rgba(224,85,112,0.5) 30%,
      rgba(224,85,112,0.6) 50%,
      rgba(224,85,112,0.5) 70%,
      rgba(224,85,112,0.3) 90%,
      transparent 100%
    );
    border-radius: 1px;
  }

  /* 四角装饰 */
  .corner {
    position: absolute; width: 24px; height: 24px; opacity: 0.35;
  }
  .corner::before, .corner::after {
    content: ''; position: absolute; background: rgba(224,85,112,0.5);
  }
  .corner-tl { top: 8px; left: 10px; }
  .corner-tr { top: 8px; right: 10px; }
  .corner-bl { bottom: 8px; left: 10px; }
  .corner-br { bottom: 8px; right: 10px; }
  .corner-tl::before, .corner-tr::before { width: 20px; height: 1px; }
  .corner-tl::after,  .corner-tr::after  { width: 1px; height: 12px; }
  .corner-bl::before, .corner-br::before { width: 20px; height: 1px; bottom:0; }
  .corner-bl::after,  .corner-br::after  { width: 1px; height: 12px; bottom:0; }
  .corner-tr::before, .corner-br::before { right:0; }
  .corner-tr::after,  .corner-br::after  { right:0; }

  /* 名字标签 */
  .name-tag {
    position: absolute;
    top: -36px; left: 48px;
    background: linear-gradient(180deg, #d64560 0%, #b83550 100%);
    padding: 8px 28px;
    border-radius: 12px 12px 0 0;
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    font-size: 16px; font-weight: bold; color: #fff;
    letter-spacing: 3px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    z-index: 3;
  }

  /* 文字区 */
  .text-area {
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    font-size: 19px; color: #f5f0e8;
    line-height: 2;
    letter-spacing: 0.8px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    margin-top: 4px;
  }

  /* 继续三角 */
  .continue-hint {
    position: absolute;
    bottom: 18px; right: 24px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 14px solid rgba(224,85,112,0.6);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
</style>
</head>
<body>

<div class="dialogue-wrapper">
  <div class="sprite-left"></div>
  <div class="name-tag">克俊华</div>
  <div class="dialogue-box">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="text-area">　「不用紧张啦！我也是新生，叫克俊华，很高兴认识你！」</div>
    <div class="continue-hint"></div>
  </div>
</div>

</body>
</html>
